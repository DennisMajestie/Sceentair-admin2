@if (isSignin()) {
  <router-outlet />
} @else {
  <a class="skip" href="#main">Skip to content</a>
  <div class="app">
    <app-topbar (paletteOpen)="togglePalette()" />
    <div class="layout" [class.sd-collapsed]="collapsed()" [class.sd-layout-animated]="layoutAnimated()">
      <app-sidebar />
      <main class="main" id="main" tabindex="-1">
        <router-outlet />
      </main>
    </div>
  </div>
  <app-palette />
}
<app-toast-host />
