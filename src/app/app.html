@if (resolved()) {
  @if (isSignin()) {
    <router-outlet />
  } @else {
    <a class="skip" href="#main">Skip to content</a>
    <div class="app">
      <app-topbar (paletteOpen)="togglePalette()" />
      @if (connectionProblem()) {
        <div class="conn-alert" role="alert" aria-live="assertive">
          <app-icon name="alert" [size]="18" />
          <div class="conn-alert__text">
            <strong>Can't reach the server</strong>
            <span>{{ connectionMessage() }}</span>
          </div>
          <button type="button" class="conn-alert__retry" (click)="retryConnection()">Retry</button>
        </div>
      }
      <div class="layout" #layoutEl [class.sd-collapsed]="collapsed()" [class.sd-layout-animated]="layoutAnimated()">
        <app-sidebar />
        <main class="main" id="main" tabindex="-1">
          <router-outlet />
        </main>
      </div>
    </div>
    <app-palette />
  }
}
<app-toast-host />
